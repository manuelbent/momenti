name: Server CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Ionos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Build Server
        working-directory: ./server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}

      - name: Inject Secrets into Config
        run: |
          sed -i "s|OPENAI_API_KEY_VALUE|${{ secrets.OPENAI_API_KEY }}|g" server/ecosystem.config.js
          sed -i "s|R2_ACCOUNT_ID_VALUE|${{ secrets.R2_ACCOUNT_ID }}|g" server/ecosystem.config.js
          sed -i "s|R2_ACCESS_KEY_ID_VALUE|${{ secrets.R2_ACCESS_KEY_ID }}|g" server/ecosystem.config.js
          sed -i "s|R2_SECRET_ACCESS_KEY_VALUE|${{ secrets.R2_SECRET_ACCESS_KEY }}|g" server/ecosystem.config.js
          sed -i "s|R2_PUBLIC_URL_VALUE|${{ secrets.R2_PUBLIC_URL }}|g" server/ecosystem.config.js

      - name: Deploy and Restart via SSH
        run: |
          # 1. Sync BOTH the server source AND the newly created 'dist' folder
          # We exclude node_modules because we'll install production-only deps on the server
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
          --exclude '.git/' \
          --exclude 'node_modules/' \
          ./server/ ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }}:/var/www/momenti/server/

          # 2. Refresh the server
          ssh -o StrictHostKeyChecking=no ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }} << 'EOF'
            set -e
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
          
            cd /var/www/momenti/server
          
            # Install dependencies
            npm ci
          
            # Run migrations
            NODE_ENV=prod npm run migrate:up
          
            # Restart PM2 using the ecosystem configuration
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
          EOF