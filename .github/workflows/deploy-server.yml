name: Server CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'database/migrations/**'
      - 'database/config.cjs'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Ionos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: './server/.nvmrc'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Build Server
        working-directory: ./server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}

      - name: Inject Secrets into Config
        run: |
          sed -i "s|OPENAI_API_KEY_VALUE|${{ secrets.OPENAI_API_KEY }}|g" server/ecosystem.config.js
          sed -i "s|R2_ACCOUNT_ID_VALUE|${{ secrets.R2_ACCOUNT_ID }}|g" server/ecosystem.config.js
          sed -i "s|R2_ACCESS_KEY_ID_VALUE|${{ secrets.R2_ACCESS_KEY_ID }}|g" server/ecosystem.config.js
          sed -i "s|R2_SECRET_ACCESS_KEY_VALUE|${{ secrets.R2_SECRET_ACCESS_KEY }}|g" server/ecosystem.config.js
          sed -i "s|R2_PUBLIC_URL_VALUE|${{ secrets.R2_PUBLIC_URL }}|g" server/ecosystem.config.js
          sed -i "s|ADMIN_TOKEN_VALUE|${{ secrets.ADMIN_TOKEN }}|g" server/ecosystem.config.js

      - name: Deploy and Restart via SSH
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
          --include='/dist/***' --include='/package*.json' \
          --include='/ecosystem.config.js' --include='/.nvmrc' --exclude='*' \
          ./server/ ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }}:/var/www/momenti/server/

          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
          --include='/migrations/***' --include='/config.cjs' --exclude='*' \
          ./database/ ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }}:/var/www/momenti/database/

          ssh -o StrictHostKeyChecking=no ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }} << 'EOF'
            set -e
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
          
            cd /var/www/momenti/server
            PM2_BIN="$(command -v pm2)"
            nvm install
          
            # Migration tooling is needed only during deployment.
            npm ci --include=dev
          
            NODE_ENV=prod npm run migrate:up
            npm prune --omit=dev

            # Remove build-time files uploaded by previous workflows.
            rm -rf /var/www/momenti/server/src /var/www/momenti/server/tests
            rm -f /var/www/momenti/server/tsconfig.json /var/www/momenti/server/vitest.config.mts
          
            "$PM2_BIN" startOrReload ecosystem.config.js --interpreter "$(command -v node)" --update-env
            "$PM2_BIN" save
          EOF