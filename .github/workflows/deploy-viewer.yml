name: Viewer CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'viewer/**'
      - 'shared/**'
      - '.github/workflows/deploy-viewer.yml'
      - '.github/workflows/test-shared.yml'
  workflow_dispatch:

jobs:
  shared:
    name: Shared CI
    uses: ./.github/workflows/test-shared.yml

  deploy:
    name: Deploy to Ionos
    needs: shared
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            ./viewer/package-lock.json
            ./shared/package-lock.json

      - name: Build Viewer
        working-directory: ./viewer
        env:
          VITE_MOMENTI_API_URL: 'https://api.momenti.cc'
        run: |
          npm ci --prefix ../shared
          npm ci
          npm run build

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}

      - name: Add Remote Host to Known Hosts
        run: ssh-keyscan -H ${{ secrets.IONOS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via Rsync
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" \
          ./viewer/dist/ ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }}:/var/www/momenti/viewer/dist/